[project]
name = "oscilloscope-studio"
version = "0.2.0"
description = "PySide6 GUI for controlling Keysight InfiniiVision 1000 X-Series oscilloscopes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "colorlog>=6.10.1,<6.11",
    "pydantic>=2.9,<3",
    "pyside6-essentials>=6.11.1,<6.12",
    "pyzmq>=26,<27",
]
